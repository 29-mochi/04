<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>様々なリスト</h1>
    <h2>ul</h2>
    <p>好きなお店</p>
    <ul>
      <li>サイゼリヤ</li>
      <li>やよい軒</li>
      <li>因幡うどん</li>
      
    </ul>
    
    <h2>ol</h2>
    <p>好きなお店ベスト３</p>
    <ol>
      <li>サイゼリヤ</li>
      <li>ジョイフル</li>
      <li>吉野家</li>

    </ol>
    
    <h2>dl</h2>
    <p>よくある質問</p>
    <dl>
      <dt>Q:いぬ？</dt>
      <dd>A:かめ</dd>
      <dt>Q:ラッコ？</dt>
      <dd>A:まーもっと</dd>
    </dl>
</body>
</html>
